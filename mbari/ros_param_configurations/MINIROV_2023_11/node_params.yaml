/depth_filter:
  ros__parameters:
    depth_subscriber: /converted/depth
    depth_publisher: /depth/filtered
    base_link_frame_id: base_link
    depth_ned_frame_id: depth_link_ned

/stereo_camera/disparity_node:
  ros__parameters:
    stereo_algorithm: 0 # 0=BLOCK_MATCHING, 1=SEMI_GLOBAL_BLOCK_MATCHING
    correlation_window_size: 15
    min_disparity: 0
    disparity_range: 128
    prefilter_size: 9
    prefilter_cap: 31
    uniqueness_ratio: 15.0
    texture_threshold: 10
    speckle_size: 100
    speckle_range: 4
    disp12_max_diff: 0

/rtabmap/reset_odometry:
  ros__parameters:
    frame_id: base_link
    guess_frame_id: state_odom

/rtabmap/odometry_filter:
  ros__parameters:
    frame_id: base_link
    odom_subscriber: /converted/state
    odometry_filter_output_topic: /rtabmap/additional_graph_links

/rtabmap/rtabmap:
  ros__parameters:
    frame_id: base_link
    map_frame_id: map
    odom_frame_id: odom
    publish_tf: True # Publish TF between map and odometry
    odom_tf_angular_variance: 1.0 # If TF is used to get odometry, this is the default angular variance
    odom_tf_linear_variance: 1.0 # If TF is used to get odometry, this is the default linear variance
    odom_sensor_sync: False
    wait_for_transform: 0.2
    database_path: ~/rtab_out/map.db
    trajectory_path: output_trajectory.csv
    approx_sync: True # If timestamps of the input topics should be synchronized using approximate or exact time policy.
    config_path: "" # Param to use if you want to load Rtab parameters from .ini file
    queue_size: 10
    qos_image: 1 # 0=System default, 1=Reliable, 2=Best Effort
    qos_odom: 1
    qos_camera_info: 1
    qos_absolute_depth: 2
    delete_db_on_start: True
    Mem/IncrementalMemory: "true"
    Mem/InitWMWithAllNodes: "false"
    Optimizer/Strategy: "2"
    Vis/FeatureType: "0" # 0=SURF 1=SIFT 2=ORB 3=FAST/FREAK 4=FAST/BRIEF 5=GFTT/FREAK 6=GFTT/BRIEF 7=BRISK 8=GFTT/ORB 9=KAZE 10=ORB-OCTREE 11=SuperPoint 12=SURF/FREAK 13=GFTT/DAISY 14=SURF/DAISY 15=PyDetector
    Kp/DetectorStrategy: "0" # 0=SURF 1=SIFT 2=ORB 3=FAST/FREAK 4=FAST/BRIEF 5=GFTT/FREAK 6=GFTT/BRIEF 7=BRISK 8=GFTT/ORB 9=KAZE 10=ORB-OCTREE 11=SuperPoint 12=SURF/FREAK 13=GFTT/DAISY 14=SURF/DAISY 15=PyDetector
    RGBD/OptimizeMaxError: "50.0"
    Rtabmap/LoopThr: "0.07"
    SURF/GpuVersion: "false"

/rtabmap/stereo_odometry:
  ros__parameters:
    frame_id: base_link
    odom_frame_id: odom # Frame to output estimated motion to
    publish_tf: True # Publish TF between odometry and base frame (base_link)
    wait_for_transform: 0.2
    approx_sync: True
    approx_sync_max_interval: 0.0 # (sec) 0 means infinite interval duration (used with approx_sync=true)
    config_path: "" # Param to use if you want to load Rtab parameters from .ini file
    queue_size: 10
    qos: 1 # Image QoS
    qos_camera_info: 1
    guess_frame_id: state_odom # Frame for guess data (output of motion estimation)
    guess_min_translation: 0.0
    guess_min_rotation: 0.0
    Vis/FeatureType: "0" # 0=SURF 1=SIFT 2=ORB 3=FAST/FREAK 4=FAST/BRIEF 5=GFTT/FREAK 6=GFTT/BRIEF 7=BRISK 8=GFTT/ORB 9=KAZE 10=ORB-OCTREE 11=SuperPoint 12=SURF/FREAK 13=GFTT/DAISY 14=SURF/DAISY 15=PyDetector
    Kp/DetectorStrategy: "0" # 0=SURF 1=SIFT 2=ORB 3=FAST/FREAK 4=FAST/BRIEF 5=GFTT/FREAK 6=GFTT/BRIEF 7=BRISK 8=GFTT/ORB 9=KAZE 10=ORB-OCTREE 11=SuperPoint 12=SURF/FREAK 13=GFTT/DAISY 14=SURF/DAISY 15=PyDetector
    SURF/GpuVersion: "false"

/rtabmap/rtabmapviz:
  ros__parameters:
    frame_id: base_link
    odom_frame_id: odom
    wait_for_transform: 0.2
    approx_sync: True
    queue_size: 10
    qos_image: 1
    qos_odom: 1
    qos_camera_info: 1
    qos_absolute_depth: 2
